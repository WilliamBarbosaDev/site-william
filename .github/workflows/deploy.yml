name: Deploy Automático para cPanel (Napoleon Host)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependências
        run: npm install --legacy-peer-deps

      - name: 🏗️ Gerar Build do Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://djythhunlppvuxkedgry.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqeXRoaHVubHBwdnV4a2VkZ3J5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDg1MTcsImV4cCI6MjEwNDMyNDUxN30.Kgj7hBnYyQCc1TxrkUMT3CEpmW8ear0LAvPNazzujMo' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqeXRoaHVubHBwdnV4a2VkZ3J5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODc0ODUxNywiZXhwIjoyMTA0MzI0NTE3fQ.790dFSMC9MRd5zsGLUiRXhSWXcsxghXTqpl-jjW_X0k' }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET || 'william-barbosa-admin-super-secret-key-2026-secure' }}
        run: npm run build

      - name: 🚀 Sincronizar com cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_TARGET_FOLDER || 'site-william/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            data/**
            src/**
            tsconfig*.json
            *.md
